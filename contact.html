      <nav class="header-nav-sp">

      <a href="contact.html" class="btn-cta">採用ご担当者様へ</a>
    </header>

    <!-- ====================== お問い合わせ ====================== -->
    <main class="contact-page">
      <p class="contact-page-watermark">CONTACT</p>

      <div class="contact-inner">
        <h2 class="contact-page-heading">お問い合わせ</h2>
        <p class="contact-page-lead">
          デザイナーとして、新しい環境でのお仕事を探しています。<br />
          下記フォームより、お気軽にご連絡ください。
        </p>
        <p class="contact-page-required">＊ は必須項目です。</p>

        <form class="contact-form" action="sent.html" method="get">
          <div class="form-group">
            <label class="form-label" for="name">お名前 <span class="form-req">＊</span></label>
            <input class="form-input" type="text" id="name" name="name" placeholder="例：山田 太郎" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="company">会社名 <span class="form-req">＊</span></label>
            <input class="form-input" type="text" id="company" name="company" placeholder="例：株式会社○○" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">メールアドレス <span class="form-req">＊</span></label>
            <input class="form-input" type="email" id="email" name="email" placeholder="example@mail.com" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="message">お問い合わせ内容 <span class="form-req">＊</span></label>
            <textarea class="form-textarea" id="message" name="message" placeholder="ご質問・ご連絡事項 等ご記入ください。" required></textarea>
          </div>

          <div class="form-agree">
            <input type="checkbox" id="agree" name="agree" required />
            <label for="agree"><a href="privacy.html">プライバシーポリシー</a>に同意する</label>
          </div>

          <button class="form-submit" type="submit">送信する</button>
        </form>
      </div>
    </main>

    <!-- ====================== フッター ====================== -->
    <footer class="footer">
      <div class="footer-inner">
        <a href="index.html">
          <img class="footer-logo" src="./images/icon-logo.svg" alt="Anchor Grid" />
        </a>
        <p class="copyright">© 2026 Anchor Grid. All Rights Reserved.</p>
      </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
      $(function () {
        // 必須項目のチェックを通ったら完了ページへ移動する
        // （入力内容がURLに残らないよう、通常の送信は止めている）
        $(".contact-form").on("submit", function (e) {
          e.preventDefault();
          location.href = "sent.html";
        });

        $(".hamburger").on("click", function () {
          $(".hamburger").toggleClass("open");
          $(".header-nav-sp").fadeToggle();
        });
        $(".header-nav-sp a, .logo a").on("click", function () {
          $(".hamburger").removeClass("open");
          $(".header-nav-sp").fadeOut();
        });
      });
    </script>
  </body>
